# Alembic. Adressen på databasen står IKKE her: env.py læser den fra miljøet, så en
# forbindelsesstreng aldrig kan havne i repoet.
[alembic]
script_location = migrationer
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = konsol

[formatters]
keys = enkel

[logger_root]
level = WARNING
handlers = konsol
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_konsol]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = enkel

[formatter_enkel]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
