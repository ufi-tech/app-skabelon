# nginx serverer frontenden og sender /api og /healthz videre til api-tjenesten.
# Browseren møder derfor kun ét domæne, og sessionscookien skal aldrig på tværs.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ingen versionsnummer ud til verden.
    server_tokens off;

    # Grundlæggende hoveder. CSP'en tillader kun vores egne filer: ingen scripts,
    # stilark, fonte eller billeder fra fremmede domæner.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # Byggede filer har et indholdsbaseret navn og kan caches længe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Alt andet er frontendens egne ruter.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
